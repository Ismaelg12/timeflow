{% extends "registration/base_password_reset.html" %}

{% block page_title %}Recuperar Senha{% endblock %}
{% block header_title %}Recuperar Senha{% endblock %}

{% block content %}
<p class="text-muted text-center mb-4">
    Digite seu e-mail cadastrado e enviaremos as instruções para redefinir sua senha.
</p>
<form method="POST">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">E-mail</label>
        <input type="email" name="email" class="form-control" placeholder="seuemail@exemplo.com" required>
    </div>
    <button type="submit" class="btn btn-primary">
        <i class="fas fa-paper-plane me-2"></i>Enviar instruções
    </button>
</form>
{% endblock %}
