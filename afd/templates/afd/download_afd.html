{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerar AFD - TimeFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            max-width: 560px;
            width: 100%;
        }
        .card-header {
            background: linear-gradient(135deg, #4361ee, #3f37c9);
            color: white;
            border-bottom: none;
            border-radius: 20px 20px 0 0 !important;
            padding: 1.5rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4361ee, #3f37c9);
            border: none;
            font-weight: 600;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <h4 class="mb-0"><i class="fas fa-file-export me-2"></i>Gerar AFD</h4>
            <small class="d-block mt-1" style="opacity:0.85;">Arquivo Fonte de Dados — Portaria MTP 671/2021</small>
        </div>
        <div class="card-body p-4">

            <div class="alert alert-info">
                <i class="fa fa-info-circle me-2"></i>
                Guarde o arquivo sem alterações — deve ser entregue ao Auditor-Fiscal
                do Trabalho quando solicitado, em até 2 dias úteis.
            </div>

            <form method="get">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Data inicial</label>
                        <input type="date" name="data_inicio" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Data final</label>
                        <input type="date" name="data_fim" class="form-control" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-4">
                    <i class="fa fa-download me-2"></i>Gerar e baixar AFD (.txt)
                </button>
            </form>
        </div>
    </div>
</body>
</html>
